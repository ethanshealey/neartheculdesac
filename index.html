<!DOCTYPE html>
<html lang="en">

<head>
    <title>Near the Culdesac</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./static/styles/styles.css" rel="stylesheet">
    <link href="./static/styles/mobile.css" rel="stylesheet">
</head>

<body>

    <header class="site-header">
        <span class="site-logo">Near the Culdesac</span>
        <nav aria-label="Site navigation">
            <ul class="site-nav">
                <li><a href="https://www.instagram.com/neartheculdesac/" target="_blank">Follow us!</a></li>
                <li><a href="https://ig.me/m/neartheculdesac" target="_blank">Book us!</a></li>
            </ul>
        </nav>
    </header>

    <section aria-label="Band members">
        <div class="section-intro">
            <p class="section-label">The People</p>
            <h2 class="section-title">Meet the Members</h2>
        </div>

        <div class="carousel-wrapper">

            <button class="carousel-btn carousel-btn-prev" aria-label="Previous member">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                    <path d="M9 2L4 7L9 12" stroke="white" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </button>

            <div class="band-grid">

                <div class="member">
                    <div class="member-bg" style="background-image: url('./static/lauren.jpg');">
                    </div>
                    <div class="member-info">
                        <h3 class="member-name">Lauren</h3>
                        <p class="member-role">Vocals</p>
                    </div>
                </div>

                <div class="member">
                    <div class="member-bg" style="background-image: url('./static/aaron.jpg');">
                    </div>
                    <div class="member-info">
                        <h3 class="member-name">Aaron</h3>
                        <p class="member-role">Guitar</p>
                    </div>
                </div>

                <div class="member">
                    <div class="member-bg" style="background-image: url('./static/julian.jpg');">
                    </div>
                    <div class="member-info">
                        <h3 class="member-name">Julian</h3>
                        <p class="member-role">Bass</p>
                    </div>
                </div>

                <div class="member">
                    <div class="member-bg" style="background-image: url('./static/prashan.jpg');">
                    </div>
                    <div class="member-info">
                        <h3 class="member-name">Prashan</h3>
                        <p class="member-role">Drums</p>
                    </div>
                </div>

                <div class="member">
                    <div class="member-bg" style="background-image: url('./static/alyssa.jpg');">
                    </div>
                    <div class="member-info">
                        <h3 class="member-name">Alyssa</h3>
                        <p class="member-role">Keys</p>
                    </div>
                </div>

            </div>

            <button class="carousel-btn carousel-btn-next" aria-label="Next member">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                    <path d="M5 2L10 7L5 12" stroke="white" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </button>

        </div>
    </section>

    <script src="./script.js"></script>
</body>

</html>
